name: Build Voxa APK

on:
  push:
    paths:
      - "jarvis-android/**"
      - ".github/workflows/jarvis-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Every Voxa build must be signed with the same key, or phones refuse to install it as an
      # update. Use the VOXA_KEYSTORE_B64 secret if it exists, otherwise a key kept in the CI cache.
      - name: Restore signing key from cache
        id: keycache
        uses: actions/cache@v4
        with:
          path: jarvis-android/voxa.keystore
          key: voxa-keystore-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.VOXA_KEYSTORE_B64 }}
          VOXA_KEYSTORE_PASSWORD: ${{ secrets.VOXA_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > voxa.keystore
          elif [ ! -f voxa.keystore ]; then
            keytool -genkeypair -v -keystore voxa.keystore -alias voxa -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${VOXA_KEYSTORE_PASSWORD:-voxa-android}" -keypass "${VOXA_KEYSTORE_PASSWORD:-voxa-android}" \
              -dname "CN=Voxa, O=Voxa, C=PK"
          fi

      - name: Run command tests
        run: gradle testDebugUnitTest

      - name: Build release APK
        env:
          VOXA_KEYSTORE_PASSWORD: ${{ secrets.VOXA_KEYSTORE_PASSWORD }}
        run: gradle assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Voxa.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxa-APK
          path: jarvis-android/Voxa.apk

      - name: Publish to "voxa-latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: voxa-latest
          name: Voxa (latest build)
          prerelease: true
          files: jarvis-android/Voxa.apk
