name: Build Voxa APK

on:
  push:
    paths:
      - "jarvis-android/**"
      - ".github/workflows/jarvis-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run command tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Voxa.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voxa-APK
          path: jarvis-android/Voxa.apk

      - name: Publish to "voxa-latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: voxa-latest
          name: Voxa (latest build)
          prerelease: true
          files: jarvis-android/Voxa.apk
